<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-label="Agent-First 工作台架构与数据流（P7）">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill:#f8fafc; }
      .card { fill:#ffffff; stroke:#dbe3ec; stroke-width:1.5; }
      .card-soft { fill:#f1f4fb; stroke:#dbe3ec; stroke-width:1.5; }
      .p7 { fill:#f5f3ff; stroke:#ddd6fe; stroke-width:1.5; }
      .ink { fill:#0f172a; }
      .muted { fill:#475569; }
      .faint { fill:#64748b; }
      .accent { fill:#5b5bd6; }
      .teal { fill:#0f766e; }
      .amber { fill:#b45309; }
      .title { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:15px; font-weight:700; }
      .label { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:12.5px; }
      .small { font-family:'Microsoft YaHei','Segoe UI',sans-serif; font-size:11.5px; }
      .mono { font-family:'Cascadia Code',Consolas,monospace; font-size:11px; }
      .line { stroke:#64748b; stroke-width:1.7; fill:none; }
      .dash { stroke:#94a3b8; stroke-width:1.4; stroke-dasharray:6 5; fill:none; }
      .chip { fill:#eef2ff; stroke:#c7d2fe; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="880"/>

  <!-- 用户 -->
  <rect class="card" x="32" y="120" width="212" height="128" rx="12"/>
  <text class="title ink" x="48" y="148">用户</text>
  <text class="small muted" x="48" y="176">· 提出目标 / 对话</text>
  <text class="small muted" x="48" y="198">· 在三个视图里看结果</text>
  <text class="small muted" x="48" y="220">· 审阅并继续追问</text>

  <!-- 三个视图 -->
  <rect class="card" x="292" y="72" width="330" height="452" rx="14"/>
  <text class="title ink" x="310" y="102">工作台前端：三个视图</text>
  <text class="small faint" x="310" y="124">需求 / 设计 / 开发是“当前关注点”，不是门禁</text>

  <rect class="card-soft" x="310" y="140" width="294" height="104" rx="10"/>
  <text class="label ink" x="324" y="164">需求视图</text>
  <text class="small muted" x="324" y="186">模块大纲 · 章节 TOC · Markdown</text>
  <text class="small muted" x="324" y="206">新建/改名/排序/切模板 · 对话</text>
  <text class="small faint" x="324" y="228">产物：docs/requirements/MOD-xxx-*.md</text>

  <rect class="card-soft" x="310" y="256" width="294" height="104" rx="10"/>
  <text class="label ink" x="324" y="280">设计视图</text>
  <text class="small muted" x="324" y="302">ER · 原型画布 · 自动导出 PNG / 过期提示</text>
  <text class="small muted" x="324" y="322">模板徽标/页面库 · 页面契约 · brief/tokens</text>
  <text class="small faint" x="324" y="344">产物：design.json + brief/tokens/prototypes</text>

  <rect class="card-soft" x="310" y="372" width="294" height="132" rx="10"/>
  <text class="label ink" x="324" y="396">开发视图</text>
  <text class="small muted" x="324" y="418">会话列表 · 时间线 · 工具/终端/diff</text>
  <text class="small muted" x="324" y="438">模块下拉 · 设计参考 · ui-check</text>
  <text class="small muted" x="324" y="458">一致性报告 · 权限卡 · 表单卡 · 停止</text>
  <text class="small faint" x="324" y="480">产物：工作区代码（frontend/ MF remote）</text>

  <!-- 工作台后端 -->
  <rect class="card" x="292" y="548" width="330" height="180" rx="14"/>
  <text class="title ink" x="310" y="578">工作台后端（Express + SQLite）</text>
  <text class="small muted" x="310" y="602">· 应用登记 / 模板默认值 / 会话登记</text>
  <text class="small muted" x="310" y="624">· artifacts：需求 / design / design-system / ui-check</text>
  <text class="small muted" x="310" y="646">· docs/ 文件监听（300ms 防抖 + 2s 轮询兜底）</text>
  <text class="small muted" x="310" y="668">· 模板/设计 skill 分发 + 设计 PNG 写入</text>
  <text class="small muted" x="310" y="690">· SSE：artifacts-changed / 会话事件 / 收尾看门狗</text>
  <text class="small faint" x="310" y="714">5 张表：apps · app_settings · app_sessions · 2 个模板库</text>

  <!-- opencode 运行时 -->
  <rect class="card" x="742" y="56" width="506" height="132" rx="14"/>
  <text class="title ink" x="760" y="86">opencode 运行时（serve · 每个应用一个 location）</text>
  <text class="small muted" x="760" y="112">会话 · 工具执行 · skills / commands（热加载） · 权限询问 · compact</text>
  <text class="small muted" x="760" y="134">原生 build agent：不限制工具和步骤；工作台只做外部管理</text>
  <text class="small faint" x="760" y="158">3 方法 skill + 2 团队 skill + 模板 skill；5 个 command</text>

  <!-- 工作区 -->
  <rect class="card" x="742" y="220" width="506" height="328" rx="14"/>
  <text class="title ink" x="760" y="250">应用工作区 projects/&lt;app&gt;/（产物 = 文件，单一事实源）</text>
  <text class="mono ink" x="760" y="278">AGENTS.md · README.md · opencode.json</text>
  <text class="small faint" x="760" y="298">应用级约定；opencode.json 对受管资源设 edit deny</text>

  <text class="mono ink" x="760" y="326">.opencode/skills/&lt;adw-*&gt; · commands/</text>
  <text class="small faint" x="760" y="346">方法/开发/团队/模板 skill；update-requirements 等 5 个 command</text>

  <text class="mono ink" x="760" y="374">docs/requirements/MOD-xxx-*.md</text>
  <text class="small faint" x="760" y="394">frontmatter：module / title / order / template；正文按 ## 章节</text>

  <text class="mono ink" x="760" y="422">docs/design/design-system.json · template/</text>
  <text class="small faint" x="760" y="442">类型/风格/蓝图根/页面库；蓝图 + structure/styles 副本</text>

  <text class="mono ink" x="760" y="470">docs/design/&lt;MOD&gt;/design.json + 页面契约</text>
  <text class="small faint" x="760" y="490">recipe/columns/actions/form/tree…；brief/tokens/prototypes 供开发参考</text>

  <text class="mono ink" x="760" y="518">docs/design/&lt;MOD&gt;/ui-check.md（软门禁）</text>
  <text class="small faint" x="760" y="538">实现前先填对照表；缺失生成、不覆盖、状态只读</text>

  <!-- 全局模板库 -->
  <rect class="card" x="742" y="586" width="240" height="142" rx="14"/>
  <text class="title ink" x="760" y="614">全局模板库（DB）</text>
  <text class="small muted" x="760" y="640">需求模板 4 · 原型模板 2（内置）</text>
  <text class="small muted" x="760" y="662">每个模板 → 一个 adw-template-* skill</text>
  <text class="small muted" x="760" y="684">保存 → 重新生成并同步引用应用</text>
  <text class="small faint" x="760" y="708">删除保护：仍被模块引用 → 409</text>

  <!-- SSE 刷新 -->
  <rect class="card-soft" x="1002" y="586" width="246" height="142" rx="14"/>
  <text class="title ink" x="1020" y="614">docs/ 变化 → 视图刷新</text>
  <text class="small muted" x="1020" y="640">watcher → hash 变化</text>
  <text class="small muted" x="1020" y="662">SSE artifacts-changed</text>
  <text class="small muted" x="1020" y="684">大纲 / 文档 / ER / 原型 / ui-check 增量重读</text>
  <text class="small faint" x="1020" y="708">外部手改文件同样生效（≤1.5s）</text>

  <!-- P7 链路 -->
  <text class="title ink" x="32" y="764">P7：模板 → 契约 → 开发 → 一致性检查</text>
  <rect class="p7" x="20" y="774" width="1240" height="94" rx="12"/>

  <rect class="card" x="32" y="786" width="232" height="70" rx="10"/>
  <text class="label ink" x="46" y="808">设计模板 pack（内置）</text>
  <text class="small muted" x="46" y="828">4 应用类型 × 4 风格 × 25 页面</text>
  <text class="small faint" x="46" y="846">蓝图 + structure + shared/style</text>

  <rect class="card" x="278" y="786" width="232" height="70" rx="10"/>
  <text class="label ink" x="292" y="808">模板中心 / preview.html</text>
  <text class="small muted" x="292" y="828">类型卡片 · 风格切换 · 页面集</text>
  <text class="small faint" x="292" y="846">iframe 预览 · 新建应用 picker</text>

  <rect class="card" x="524" y="786" width="232" height="70" rx="10"/>
  <text class="label ink" x="538" y="808">design-system + 页面契约</text>
  <text class="small muted" x="538" y="828">类型/风格/蓝图根/页面库</text>
  <text class="small faint" x="538" y="846">design.json：recipe/columns/actions</text>

  <rect class="card" x="770" y="786" width="232" height="70" rx="10"/>
  <text class="label ink" x="784" y="808">开发提示 + ui-check</text>
  <text class="small muted" x="784" y="828">prompt · digest · AGENTS · skill</text>
  <text class="small faint" x="784" y="846">先填 ui-check.md（软门禁）</text>

  <rect class="card" x="1016" y="786" width="232" height="70" rx="10"/>
  <text class="label ink" x="1030" y="808">MF remote + fidelity</text>
  <text class="small muted" x="1030" y="828">PageTemplates · pm-* · GlobalPreference</text>
  <text class="small faint" x="1030" y="846">12 项只读：CLI / API / 开发视图</text>

  <path class="line" d="M 264 821 L 278 821" marker-end="url(#arrow)"/>
  <path class="line" d="M 510 821 L 524 821" marker-end="url(#arrow)"/>
  <path class="line" d="M 756 821 L 770 821" marker-end="url(#arrow)"/>
  <path class="line" d="M 1002 821 L 1016 821" marker-end="url(#arrow)"/>

  <!-- 连线 -->
  <!-- 用户 ↔ 三视图 -->
  <path class="line" d="M 244 168 L 292 168" marker-end="url(#arrow)"/>
  <path class="line" d="M 292 200 L 244 200" marker-end="url(#arrow)"/>
  <text class="small faint" x="236" y="150" text-anchor="end">目标 / 消息</text>
  <text class="small faint" x="236" y="224" text-anchor="end">结果</text>

  <!-- 三视图 ↔ 工作台后端 -->
  <path class="line" d="M 420 524 L 420 548" marker-end="url(#arrow)"/>
  <path class="line" d="M 500 548 L 500 524" marker-end="url(#arrow)"/>
  <text class="small faint" x="430" y="542">REST</text>
  <text class="small faint" x="510" y="542">JSON</text>

  <!-- 工作台后端 ↔ opencode -->
  <path class="line" d="M 622 580 L 630 580 L 630 100 L 742 100" marker-end="url(#arrow)"/>
  <path class="line" d="M 742 128 L 734 128 L 734 600 L 622 600" marker-end="url(#arrow)"/>
  <text class="small faint" x="682" y="330" text-anchor="middle">HTTP + SSE</text>
  <text class="small faint" x="682" y="500" text-anchor="middle">会话 / 权限</text>

  <!-- opencode ↔ 工作区 -->
  <path class="line" d="M 900 188 L 900 220" marker-end="url(#arrow)"/>
  <path class="line" d="M 1000 220 L 1000 188" marker-end="url(#arrow)"/>
  <text class="small faint" x="808" y="182" text-anchor="end">读 skills / 改文件</text>
  <text class="small faint" x="1030" y="182">工具结果</text>

  <!-- 工作台 ↔ 工作区 -->
  <path class="line" d="M 622 568 L 742 568 L 742 548" marker-end="url(#arrow)"/>
  <text class="small faint" x="640" y="562">解析 docs / 监听</text>

  <!-- 模板库 → 工作区 -->
  <path class="dash" d="M 862 586 L 862 548" marker-end="url(#arrow)"/>
  <text class="small faint" x="870" y="572">分发 skill</text>

  <!-- SSE 卡片 → 三视图（沿画布右侧外缘绕行，避免穿过工作区文字） -->
  <path class="dash" d="M 1248 640 L 1262 640 L 1262 205 L 622 205" marker-end="url(#arrow)"/>
  <text class="small faint" x="680" y="200" text-anchor="middle">事件 → 增量刷新</text>

  <!-- P7 链路 → 后端/工作区 -->
  <path class="dash" d="M 394 786 L 394 728" marker-end="url(#arrow)"/>
  <text class="small faint" x="402" y="770">pack / preview 托管</text>
  <path class="dash" d="M 640 786 L 640 728" marker-end="url(#arrow)"/>
  <text class="small faint" x="648" y="770">design-system / 契约解析</text>
</svg>
