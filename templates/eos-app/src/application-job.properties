### web

management.health.mail.enabled=false

### mybatis
mybatis.mapper-locations=classpath*:mybatis-mapper/*Mapper.xml
#mybatis.type-aliases-package=com.xxl.job.admin.core.model

### xxl-job, email
spring.mail.host=smtp.qq.com
spring.mail.port=25
spring.mail.username=${MAIL_USERNAME:}
spring.mail.from=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

### afc-job, access token
#afc.job.admin.accessToken=default_token

### afc-job, i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
#afc.job.admin.i18n=zh_CN
xxl.job.i18n=zh_CN
xxl.job.accessToken=

## afc-job, triggerpool max size
#afc.job.admin.triggerpool.fast.max=200
#afc.job.admin.triggerpool.slow.max=100
xxl.job.triggerpool.fast.max=200
xxl.job.triggerpool.slow.max=100
afc.job.admin.enabled=false
afc.job.executor.enabled=false
### afc-job, log retention days
#afc.job.admin.logretentiondays=30
xxl.job.logretentiondays=30
