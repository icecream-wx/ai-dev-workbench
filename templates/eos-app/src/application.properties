server.port={{PORT}}
server.servlet.context-path=/
spring.application.name={{APP_NAME}}
server.servlet.session.timeout=7200

server.pas.accept-count=100
server.pas.max-connections=10000
server.pas.threads.max=500
server.pas.threads.min-spare=100

spring.mvc.date-format: yyyy-MM-dd HH:mm:ss

#spring.profiles.active=eureka
spring.profiles.active=nacos,afc,job

management.endpoints.web.exposure.include=hystrix.stream,health,info,loggers,eos,mappings,startup

out.config.folder=config
#bps.application.name=BPS-SERVER
#bps.tenant.id=BPS_DEFAULT_TENANT
#engine.show.log=true

eos.application.sys-code={{APP_ID}}
eos.application.sys-key={{EOS_SYS_KEY}}
eos.admin.port=7888
# eos environment: dev prod test
eos.profiles.active=dev

# eos-cache
eos.cache.mode=redis

spring.session.store-type=none
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
#spring.data.redis.password=primeton
#spring.data.redis.lettuce.pool.max-active=100
#spring.data.redis.lettuce.pool.max-idle=100
#spring.data.redis.lettuce.pool.max-wait=5000

#spring.session.store-type=redis
#spring.session.redis.namespace=ZZ,DEMO-PROVIDER01,default
#spring.main.allow-bean-definition-overriding=true

#logging.level.org.springframework.boot.context.config=DEBUG

management.tracing.enabled=false
#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false
spring.main.lazy-initialization=true
